[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-b2b-procurement-agent"
version = "1.1.0"
description = "Autonomous B2B Supply Chain and Procurement Agent with Deterministic 3-Way Matching and HITL Control Tower"
authors = [{ name = "Samuel H. Tampubolon", email = "samuelhtampubolon@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0,<1.0.0",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "slowapi>=0.1.9",
    "pyjwt>=2.10.1",
    "bcrypt>=4.1.0,<6.0.0",
    "streamlit>=1.50.0",
    "plotly>=5.24.0",
    "requests>=2.32.4",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
